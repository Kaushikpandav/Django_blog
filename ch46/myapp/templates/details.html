<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->

<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Detaisl of User</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
  </head>
  <body>
    <h1>Student Details</h1>
    <p><strong>Name:</strong> {{ data.name }}</p>
    <p><strong>Email:</strong> {{ data.email }}</p>
    <p><strong>Roll:</strong> {{ data.roll }}</p>
    <p><strong>City:</strong> {{ data.city }}</p>

    <a href="{% url 'student_success' %}">Back to List</a>

    <a href="{% url 'student_update' data.id %}" style="display:inline-block; padding: 5px 10px; background-color: #007bff; color: white; text-decoration: none; border-radius: 3px;">Update Student</a>

    <form method="post" action="{% url 'student_delete' data.id %}" style="display:inline;">
      {% csrf_token %}
      <button type="submit" onclick="return confirm('Are you sure you want to delete this student?')">Delete Student</button>
    </form>

    <script src="" async defer></script>
  </body>
</html>
